files:
  - name: "_copy_pbsv_vcf"
    input: "long_read/pbsv_call/{sample}_{type}.vcf"
    output: "results/sv/{sample}_{type}.pbsv.vcf"
  
  - name: "_copy_sniffles_vcf"
    input: "long_read/sniffles/{sample}_{type}.vcf"
    output: "results/sv/{sample}_{type}.sniffles.vcf"

  - name: "_copy_minimap2_tsv"
    output: "result/{sample}_{type}.output.minimap2.bam"
    input: "long_read/minimap2/{sample}_{type}.bam"

  - name: "_copy_automap_pdf"
    input: "results/cnv_sv/{sample}_{type}_{flowcell}_{barcode}/{sample}_{type}_{flowcell}_{barcode}.HomRegions.pdf"
    output: "results/cnv_sv/{sample}_{type}_{flowcell}_{barcode}/{sample}_{type}_{flowcell}_{barcode}.HomRegions.pdf"
    
  - name: "_copy_automap_tsv"
    input: "cnv_sv/cnv_sv/{sample}_{type}_{flowcell}_{barcode}/{sample}_{type}_{flowcell}_{barcode}.HomRegions.tsv"
    output: "results/cnv_sv/{sample}_{type}_{flowcell}_{barcode}/{sample}_{type}_{flowcell}_{barcode}.HomRegions.tsv"

  - name: "_copy_cpgtools_bed"
    input: "long_read/cpgtools/{sample}_{type}_{processing_unit}_{barcode}.combined.bed",
    output: "results/{sample}_{type}_{processing_unit}_{barcode}.combined.bed",
    
  - name: "_copy_cpgtools_bw"
    input: "long_read/cpgtools/{sample}_{type}_{processing_unit}_{barcode}.combined.bw",
    output: "results/{sample}_{type}_{processing_unit}_{barcode}.combined.bw",
    
